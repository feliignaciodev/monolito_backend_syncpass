# Proxy inverso de SyncPass API. El trafico publico entra por API Gateway (HTTPS) y llega aqui por
# HTTP con el encabezado X-Origin-Verify; sin ese valor se responde 403, asi nadie puede saltarse
# API Gateway llamando directo a la IP. setup-server.sh reemplaza __ORIGIN_SECRET__.
server {
    listen 80 default_server;
    server_name _;

    # Lotes de sincronizacion de hasta 500 registros
    client_max_body_size 2m;

    if ($http_x_origin_verify != "__ORIGIN_SECRET__") {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # El cliente siempre habla HTTPS con API Gateway
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Origin-Verify "";
        # API Gateway corta a los 30 s
        proxy_read_timeout 30s;
    }
}
