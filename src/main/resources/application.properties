# SyncPass API - configuracion
spring.application.name=syncpass-api

# Base de datos (Supabase / PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/syncpass}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Cognito / OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_example}

# Propiedades propias de Cognito
cognito.client-id=${COGNITO_CLIENT_ID:}
cognito.region=${AWS_REGION:us-east-1}
cognito.user-pool-id=${COGNITO_USER_POOL_ID:}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# SyncPass
# Carga proyectos, eventos y participantes FICTICIOS al arrancar si la base no tiene proyectos
syncpass.datos-semilla=${SYNCPASS_DATOS_SEMILLA:true}
# Zona horaria de los datos semilla y de la columna timestamp_iso del CSV
syncpass.zona-horaria=America/Santiago